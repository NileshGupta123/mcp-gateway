# Production-like VPS (k3s). Domain, storage aur image registry yahan badlenge, chart wahi rahega.
store:
  host: store.example.com
  scheme: https
  ingress:
    className: traefik
    tls:
      enabled: true
      secretName: store-tls

# k3s ka default "local-path"; managed cloud pe yahan uski class aayegi
storageClass: ""

mariadb:
  storage: 10Gi

wordpress:
  storage: 10Gi

wooMcp:
  # Prod mein image registry se pull hoti hai (local mein k3d image import se aati hai)
  image: ghcr.io/nileshgupta123/urumi-woo-mcp:0.1.0
  imagePullPolicy: Always

mcpServers:
  notes:
    image: ghcr.io/nileshgupta123/urumi-notes-mcp:0.1.0
    imagePullPolicy: Always
  time:
    image: ghcr.io/nileshgupta123/urumi-time-mcp:0.1.0
    imagePullPolicy: Always

postgres:
  storage: 5Gi

gateway:
  image: ghcr.io/nileshgupta123/urumi-gateway:0.1.0
  imagePullPolicy: Always
  host: app.example.com
  adminEmail: admin@example.com
  tlsSecretName: app-tls

dashboard:
  image: ghcr.io/nileshgupta123/urumi-dashboard:0.1.0
  imagePullPolicy: Always
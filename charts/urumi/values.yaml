# Defaults. Environment-specific cheezein values-local.yaml / values-prod.yaml mein override hoti hain.

store:
  # Browser mein jo URL se store khulega
  host: store.localtest.me
  scheme: http
  title: "Urumi Store"
  admin:
    user: admin
    email: admin@example.com
  ingress:
    className: traefik
    tls:
      enabled: false
      secretName: ""

# Khali = cluster ka default StorageClass (k3d/k3s mein "local-path")
storageClass: ""

mariadb:
  image: mariadb:11.4
  database: wordpress
  user: wordpress
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

wordpress:
  # WooCommerce ka latest WordPress 7.0+ maangta hai, isliye 6.x image kaam nahi karti.
  # Reproducible build ke liye baad mein yahan exact tag pin karenge.
  image: wordpress:apache
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

woocommerce:
  # Khali = latest. Reproducible build ke liye yahan version pin kar sakte ho
  version: ""
  currency: INR
  country: "IN:MH"

wpcli:
  image: wordpress:cli
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

wooMcp:
  image: urumi/woo-mcp:0.1.0
  imagePullPolicy: IfNotPresent
  # "Aaj ke orders" ki definition is timezone se hoti hai
  storeTimezone: Asia/Kolkata
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
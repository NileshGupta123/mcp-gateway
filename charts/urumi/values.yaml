# Defaults. Environment-specific settings are overridden in values-local.yaml and values-prod.yaml.

store:
  # The URL the store is opened at in the browser
  host: store.localtest.me
  scheme: http
  title: "Urumi Store"
  admin:
    user: admin
    email: admin@example.com
  ingress:
    className: traefik
    tls:
      enabled: false
      secretName: ""

# Empty means the cluster's default StorageClass ("local-path" on k3d and k3s)
storageClass: ""

mariadb:
  image: mariadb:11.4
  database: wordpress
  user: wordpress
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

wordpress:
  # The image tag and coreVersion move together. The image only seeds an empty volume: an existing
  # volume keeps its old core files, so the setup job runs `wp core update --version=<coreVersion>`
  # on every install and upgrade. Leave coreVersion empty to follow the latest release.
  image: wordpress:7.1.3-apache
  coreVersion: "7.1.3"
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

woocommerce:
  # The setup job installs this version, and moves an existing install to it. Empty means the latest.
  version: "11.2.0"
  currency: INR
  country: "IN:MH"

wpcli:
  image: wordpress:cli
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi

wooMcp:
  image: urumi/woo-mcp:0.1.0
  imagePullPolicy: IfNotPresent
  # "Today's orders" is defined in this timezone
  storeTimezone: Asia/Kolkata
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Extra upstream MCP servers. All of them are deployed from one generic template (mcp-servers.yaml).
mcpServers:
  notes:
    image: urumi/notes-mcp:0.1.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  time:
    image: urumi/time-mcp:0.1.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# The gateway's database (users, API keys, upstream registry, audit log)
postgres:
  image: postgres:16-alpine
  storage: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Gateway backend (admin API and the /mcp endpoint). The dashboard is served on the same host.
gateway:
  image: urumi/gateway:0.1.0
  imagePullPolicy: IfNotPresent
  host: app.localtest.me
  adminEmail: admin@example.com
  tlsSecretName: app-tls
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

# React dashboard (static files, non-root nginx)
dashboard:
  image: urumi/dashboard:0.1.0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 96Mi

# Chat agent. The API key is not here: it comes from the Kubernetes Secret "apiKeySecret" (key: api-key),
# which is created outside Helm (scripts/set-llm-key.ps1). Any OpenAI-compatible provider works.
# Models: "model" first, and "fallbackModel" when it fails (both on Groq).
chat:
  baseUrl: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  fallbackModel: openai/gpt-oss-20b
  apiKeySecret: urumi-llm
  maxSteps: 6
  timezone: Asia/Kolkata

# Traffic inside the namespace is denied by default, and only the needed paths are allowed
# (templates/networkpolicy.yaml). k3s (k3d and VPS alike) ships a NetworkPolicy controller.
# Set this to false only in an emergency.
networkPolicy:
  enabled: true
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-woo-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi.labels" (dict "root" . "name" "woo-mcp") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "urumi.selector" (dict "root" . "name" "woo-mcp") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-woo-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi.labels" (dict "root" . "name" "woo-mcp") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "urumi.selector" (dict "root" . "name" "woo-mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "urumi.labels" (dict "root" . "name" "woo-mcp") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp
          image: {{ .Values.wooMcp.image }}
          imagePullPolicy: {{ .Values.wooMcp.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: WOO_BASE_URL
              value: "http://{{ .Release.Name }}-wordpress"
            - name: WOO_HOST_HEADER
              value: {{ .Values.store.host | quote }}
            - name: STORE_PUBLIC_URL
              value: "{{ .Values.store.scheme }}://{{ .Values.store.host }}"
            - name: STORE_TZ
              value: {{ .Values.wooMcp.storeTimezone | quote }}
            - name: WOO_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-woo-api
                  key: consumer-key
            - name: WOO_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-woo-api
                  key: consumer-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
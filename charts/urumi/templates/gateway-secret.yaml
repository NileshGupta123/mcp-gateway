{{- $name := printf "%s-gateway" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $pg := randAlphaNum 24 -}}
{{- $session := randAlphaNum 48 -}}
{{- $fernet := randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" -}}
{{- $admin := randAlphaNum 20 -}}
{{- if $existing -}}
{{- $pg = index $existing.data "postgres-password" | b64dec -}}
{{- $session = index $existing.data "session-secret" | b64dec -}}
{{- $fernet = index $existing.data "fernet-key" | b64dec -}}
{{- $admin = index $existing.data "admin-password" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi.labels" (dict "root" . "name" "gateway") | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ $pg | b64enc | quote }}
  session-secret: {{ $session | b64enc | quote }}
  fernet-key: {{ $fernet | b64enc | quote }}
  admin-password: {{ $admin | b64enc | quote }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-store
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi.labels" (dict "root" . "name" "store-ingress") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.store.ingress.className }}
  {{- if .Values.store.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.store.host | quote }}
      secretName: {{ .Values.store.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-wordpress
                port:
                  name: http
{{- $name := printf "%s-store-db" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $rootPw := randAlphaNum 24 -}}
{{- $userPw := randAlphaNum 24 -}}
{{- if $existing -}}
{{- $rootPw = index $existing.data "mariadb-root-password" | b64dec -}}
{{- $userPw = index $existing.data "mariadb-password" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi.labels" (dict "root" . "name" "store-db") | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ $rootPw | b64enc | quote }}
  mariadb-password: {{ $userPw | b64enc | quote }}
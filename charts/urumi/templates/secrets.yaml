{{- $ns := .Release.Namespace -}}

{{- $dbName := printf "%s-store-db" .Release.Name -}}
{{- $db := lookup "v1" "Secret" $ns $dbName -}}
{{- $rootPw := randAlphaNum 24 -}}
{{- $userPw := randAlphaNum 24 -}}
{{- if $db -}}
{{- $rootPw = index $db.data "mariadb-root-password" | b64dec -}}
{{- $userPw = index $db.data "mariadb-password" | b64dec -}}
{{- end -}}

{{- $adminName := printf "%s-store-admin" .Release.Name -}}
{{- $admin := lookup "v1" "Secret" $ns $adminName -}}
{{- $adminPw := randAlphaNum 20 -}}
{{- if $admin -}}
{{- $adminPw = index $admin.data "admin-password" | b64dec -}}
{{- end -}}

{{- $wooName := printf "%s-woo-api" .Release.Name -}}
{{- $woo := lookup "v1" "Secret" $ns $wooName -}}
{{- $ck := printf "ck_%s" (randAlphaNum 40 | lower) -}}
{{- $cs := printf "cs_%s" (randAlphaNum 40 | lower) -}}
{{- if $woo -}}
{{- $ck = index $woo.data "consumer-key" | b64dec -}}
{{- $cs = index $woo.data "consumer-secret" | b64dec -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" . "name" "store-db") | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ $rootPw | b64enc | quote }}
  mariadb-password: {{ $userPw | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminName }}
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" . "name" "store-admin") | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $adminPw | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $wooName }}
  namespace: {{ $ns }}
  labels:
    {{- include "urumi.labels" (dict "root" . "name" "woo-api") | nindent 4 }}
type: Opaque
data:
  consumer-key: {{ $ck | b64enc | quote }}
  consumer-secret: {{ $cs | b64enc | quote }}